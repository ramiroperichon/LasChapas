<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1100" width="1800" height="1100">
<!-- ILUSTRACIÓN PROVISIONAL — no es una fotografía de Las Chapas ni de la avenida San Martín -->
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9d2b0"/><stop offset="1" stop-color="#f4e3c8"/></linearGradient>
<linearGradient id="road" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a7a68"/><stop offset="1" stop-color="#4c4239"/></linearGradient>
<filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch" result="n"/><feColorMatrix in="n" type="matrix" values="0 0 0 0 .5  0 0 0 0 .45  0 0 0 0 .4  0 0 0 .9 -.35"/></filter>
</defs>
<rect width="1800" height="1100" fill="url(#sky)"/>
<polygon points="860,560 940,560 1800,1100 0,1100" fill="url(#road)"/>
<polygon points="895,580 905,580 980,1100 820,1100" fill="#efe1c6" opacity=".5"/>
<polygon points="0,560 860,560 0,1000" fill="#a99474"/>
<polygon points="940,560 1800,560 1800,1000" fill="#a99474"/>
<g fill="#3c3a2c">
<ellipse cx="200" cy="420" rx="260" ry="220"/><rect x="190" y="520" width="22" height="420"/>
<ellipse cx="560" cy="470" rx="150" ry="120"/><rect x="552" y="540" width="14" height="200"/>
<ellipse cx="760" cy="510" rx="80" ry="64"/><rect x="756" y="550" width="8" height="70"/>
<ellipse cx="1600" cy="420" rx="260" ry="220"/><rect x="1590" y="520" width="22" height="420"/>
<ellipse cx="1240" cy="470" rx="150" ry="120"/><rect x="1234" y="540" width="14" height="200"/>
<ellipse cx="1040" cy="510" rx="80" ry="64"/><rect x="1036" y="550" width="8" height="70"/>
</g>
<g fill="#b8654a" opacity=".55"><ellipse cx="560" cy="440" rx="90" ry="50"/><ellipse cx="1240" cy="440" rx="90" ry="50"/><ellipse cx="200" cy="360" rx="150" ry="80"/></g>
<rect width="1800" height="1100" filter="url(#grain)" opacity=".5"/>
</svg>
