<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1400" width="1000" height="1400">
<!-- ILUSTRACIÓN PROVISIONAL — no es una fotografía de Las Chapas -->
<defs>
<linearGradient id="wall" x1="0" x2="1"><stop offset="0" stop-color="#e2cdb0"/><stop offset="1" stop-color="#c9ab86"/></linearGradient>
<linearGradient id="door" x1="0" x2="1"><stop offset="0" stop-color="#a55a3e"/><stop offset="1" stop-color="#7d3f2a"/></linearGradient>
<filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch" result="n"/><feColorMatrix in="n" type="matrix" values="0 0 0 0 .5  0 0 0 0 .45  0 0 0 0 .4  0 0 0 .9 -.35"/></filter>
</defs>
<rect width="1000" height="1400" fill="url(#wall)"/>
<rect x="270" y="300" width="460" height="960" fill="#3a2e26"/>
<rect x="290" y="320" width="420" height="940" fill="url(#door)"/>
<g fill="none" stroke="#6a3423" stroke-width="6"><rect x="340" y="380" width="320" height="380"/><rect x="340" y="820" width="320" height="380"/></g>
<rect x="640" y="760" width="16" height="70" fill="#e6c79a"/>
<polygon points="0,0 1000,0 1000,240 0,520" fill="#1d1b19" opacity=".28"/>
<polygon points="0,1260 1000,1260 1000,1400 0,1400" fill="#8a7055"/>
<rect x="0" y="1254" width="1000" height="10" fill="#6d5640"/>
<polygon points="730,330 1000,190 1000,1260 730,1260" fill="#1d1b19" opacity=".14"/>
<rect width="1000" height="1400" filter="url(#grain)" opacity=".5"/>
</svg>
