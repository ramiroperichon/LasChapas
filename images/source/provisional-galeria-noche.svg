<rect width="1200" height="1500" fill="url(#w)"/>
<rect width="1200" height="1500" fill="url(#g)"/>
<rect x="380" y="440" width="440" height="520" fill="url(#win)"/>
<rect x="594" y="440" width="12" height="520" fill="#2a1f19"/><rect x="380" y="690" width="440" height="12" fill="#2a1f19"/>
<rect x="360" y="960" width="480" height="26" fill="#3a302a"/>
<polygon points="380,986 820,986 1000,1500 200,1500" fill="#f3a76b" opacity=".12"/>
<rect width="1200" height="1500" filter="url(#grain)" opacity=".6"/>
</svg>
