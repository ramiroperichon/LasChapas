<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500">
<!-- ILUSTRACIÓN PROVISIONAL — no es una fotografía de Las Chapas -->
<defs>
<linearGradient id="w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2522"/><stop offset="1" stop-color="#171412"/></linearGradient>
<radialGradient id="g" cx="600" cy="700" r="520" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#f3a76b" stop-opacity=".45"/><stop offset="1" stop-color="#f3a76b" stop-opacity="0"/></radialGradient>
<linearGradient id="win" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd89f"/><stop offset="1" stop-color="#e48a4c"/></linearGradient>
<filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch" result="n"/><feColorMatrix in="n" type="matrix" values="0 0 0 0 .5  0 0 0 0 .45  0 0 0 0 .4  0 0 0 .9 -.35"/></filter>
