<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" width="1400" height="1000">
<!-- ILUSTRACIÓN PROVISIONAL — no es una fotografía de Las Chapas -->
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7f97a3"/><stop offset="1" stop-color="#e4d6c1"/></linearGradient>
<linearGradient id="rib" x1="0" x2="1"><stop offset="0" stop-color="#4f4b46"/><stop offset=".35" stop-color="#9c968c"/><stop offset=".55" stop-color="#b9b2a6"/><stop offset="1" stop-color="#4f4b46"/></linearGradient>
<pattern id="ribs" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(28)"><rect width="40" height="40" fill="url(#rib)"/></pattern>
<filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch" result="n"/><feColorMatrix in="n" type="matrix" values="0 0 0 0 .5  0 0 0 0 .45  0 0 0 0 .4  0 0 0 .9 -.35"/></filter>
</defs>
<rect width="1400" height="1000" fill="url(#sky)"/>
<polygon points="0,560 1400,180 1400,1000 0,1000" fill="url(#ribs)"/>
<polygon points="0,560 1400,180 1400,210 0,600" fill="#1d1b19" opacity=".55"/>
<polygon points="0,600 1400,210 1400,1000 0,1000" fill="#1d1b19" opacity=".25"/>
<rect width="1400" height="1000" filter="url(#grain)" opacity=".5"/>
</svg>
