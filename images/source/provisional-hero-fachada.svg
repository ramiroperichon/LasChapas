<radialGradient id="sun" cx="1820" cy="1040" r="760" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ffd8a6" stop-opacity=".95"/><stop offset=".22" stop-color="#eea06c" stop-opacity=".5"/><stop offset="1" stop-color="#b86c4b" stop-opacity="0"/></radialGradient>
<linearGradient id="rib" x1="0" x2="1"><stop offset="0" stop-color="#4f4b46"/><stop offset=".35" stop-color="#9c968c"/><stop offset=".55" stop-color="#b9b2a6"/><stop offset="1" stop-color="#4f4b46"/></linearGradient>
